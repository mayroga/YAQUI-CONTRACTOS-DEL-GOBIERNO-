<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>KAMIZEN GOV AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0f16;
            color: white;
            font-family: Arial, sans-serif;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        #searchBar {
            display: flex;
            gap: 10px;
        }

        input {
            padding: 10px;
            border-radius: 10px;
            border: none;
            width: 300px;
        }

        button {
            padding: 10px 15px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            background: #4d8cff;
            color: white;
        }

        #main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #sidebar {
            width: 400px;
            border-right: 1px solid rgba(255,255,255,0.1);
            overflow-y: auto;
        }

        #results {
            padding: 10px;
        }

        .card {
            background: rgba(255,255,255,0.05);
            margin: 10px;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
        }

        #content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #screen {
            flex: 1;
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            overflow-y: auto;
        }

        #logs {
            height: 150px;
            overflow-y: auto;
            font-size: 12px;
            padding: 10px;
            background: rgba(0,0,0,0.3);
        }
    </style>
</head>

<body>

<div id="app">

    <!-- HEADER -->
    <div id="header">

        <div><b>KAMIZEN GOV AI</b></div>

        <div id="searchBar">

            <input id="searchInput" placeholder="Search contracts..." />

            <button onclick="searchContracts()">Search</button>

            <button onclick="openFile()">OCR Scan</button>

            <input type="file" id="fileInput" hidden />

        </div>
    </div>

    <!-- MAIN -->
    <div id="main">

        <!-- SIDEBAR -->
        <div id="sidebar">
            <div id="results"></div>
        </div>

        <!-- CONTENT -->
        <div id="content">

            <div id="screen">
                Ready to analyze contracts...
            </div>

            <div id="logs"></div>

        </div>

    </div>

</div>

<script>

const screen = document.getElementById("screen");
const logs = document.getElementById("logs");
const results = document.getElementById("results");
const fileInput = document.getElementById("fileInput");

function log(msg) {
    logs.innerHTML += `<div>${msg}</div>`;
    logs.scrollTop = logs.scrollHeight;
}

/* =========================
   SEARCH CONTRACTS
========================= */

async function searchContracts() {

    const q = document.getElementById("searchInput").value;

    log("Searching: " + q);

    const res = await fetch(`/api/contracts/search?q=${q}`);
    const data = await res.json();

    results.innerHTML = "";

    data.results.forEach(c => {

        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <b>${c.title}</b><br/>
            <small>${c.agency}</small><br/>
            Score: ${c.score}
        `;

        div.onclick = () => {
            screen.innerText = JSON.stringify(c, null, 2);
        };

        results.appendChild(div);
    });

    log("Contracts loaded: " + data.count);
}

/* =========================
   OCR FLOW
========================= */

function openFile() {
    fileInput.click();
}

fileInput.addEventListener("change", async (e) => {

    const file = e.target.files[0];

    log("Uploading file...");

    const formData = new FormData();
    formData.append("file", file);

    const res = await fetch("/api/ocr", {
        method: "POST",
        body: formData
    });

    const data = await res.json();

    log("OCR completed");

    if (data.success) {
        screen.innerText = data.data.text;
    } else {
        screen.innerText = "OCR ERROR";
    }
});

</script>

</body>
</html>
